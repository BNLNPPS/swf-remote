{% extends 'base.html' %}

{% block title %}MCP endpoint — ePIC Production Monitor{% endblock %}

{% block extra_head %}
<style>
  .mcp-setup { max-width: 860px; font-size: 1.05rem; line-height: 1.55; }
  .mcp-setup h1 { font-size: 1.6rem; margin-bottom: 1rem; }
  .mcp-setup h2 { font-size: 1.25rem; margin-top: 1.5rem; }
  .mcp-setup pre { background: #f1f3f5; padding: .75rem 1rem; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
  .mcp-setup li { margin-bottom: .5rem; }

{% endblock %}

{% block content %}
<div class="container mt-4 mcp-setup">{{ html|safe }}</div>
{% endblock %}
