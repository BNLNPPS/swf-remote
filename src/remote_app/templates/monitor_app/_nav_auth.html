{% load authority_status %}<div class="nav-auth">
    {% if user.is_authenticated %}
        {% authority_status as st %}
        <a href="{% url 'monitor_app:account' %}?tab=account{% if request.GET.user_view == '1' %}&amp;user_view=1{% endif %}" title="Your account: GitHub login and eic membership">{{ user.username }}</a>{% if st.state == 'failed' or st.state == 'unchecked' %} <a href="{% url 'monitor_app:account' %}?tab=account" style="color:#ffb4a8;font-weight:600;">membership not checked</a>{% endif %}
        <form method="post" action="{% url 'logout' %}" style="display:inline;margin:0;">{% csrf_token %}<button type="submit" style="background:none;border:none;color:inherit;cursor:pointer;padding:0;font:inherit;">Logout</button></form>
    {% else %}
        <a href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Login</a>
    {% endif %}
</div>
