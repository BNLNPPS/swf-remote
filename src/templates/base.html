{% load static monitor_nav %}
<!DOCTYPE html>
<html lang="en" data-nav-mode="production">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ePIC Production Monitor{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/state-colors.css' %}">
    <style>
      nav {
        display: flex;
        align-items: center;
        gap: .8em;
      }
      .sticky-header {
        position: sticky;
        top: 0;
        z-index: 1030;
      }
      .nav-spacer {
        flex: 1 1 auto;
      }
      .nav-auth {
        display: flex;
        gap: .8em;
      }
      nav a {
        color: #ADD8E6;
      }
      nav a.nav-active {
        text-shadow: 0 0 .65px currentColor, 0 0 .65px currentColor;
      }
      /* Dropdown Button */
      .dropbtn {
        background-color: inherit;
        color: #8fc7e8;
        text-decoration: none;
        padding: 0;
        font-size: inherit;
        border: none;
        cursor: pointer;
      }
      .dropbtn.nav-active {
        text-shadow: 0 0 .65px currentColor, 0 0 .65px currentColor;
      }
      /* The container <div> - needed to position the dropdown content */
      .dropdown {
        position: relative;
        display: inline-block;
        margin-right: .35em;
      }
      /* Dropdown Content (Hidden by Default) */
      .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1;
      }
      /* Links inside the dropdown */
      .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
      }
      .dropdown-content a.nav-active {
        background-color: #e9ecef;
      }
      /* Change color of dropdown links on hover */
      .dropdown-content a:hover {background-color: #f1f1f1}
      /* Show the dropdown menu on hover */
      .dropdown:hover .dropdown-content {
        display: block;
      }
      /* Nav mode flipper */
      .nav-mode { display: none; }
      .nav-mode.active { display: contents; }
      html[data-nav-mode="production"] .nav-production,
      html[data-nav-mode="testbed"] .nav-testbed { display: contents; }
      #mode-label {
        border-right: 1px solid rgba(255,255,255,.2);
        color: #fff;
        font-weight: 700;
        padding-right: 12px;
        margin-right: 4px;
      }
      #mode-label .mode-title { display: none; }
      html[data-nav-mode="production"] #mode-label .mode-title-production,
      html[data-nav-mode="testbed"] #mode-label .mode-title-testbed { display: inline; }
      .nav-label {
        color: #fff;
        font-weight: 700;
      }
      .nav-panda-label {
        margin-left: 1.5em;
      }
      .nav-analysis {
        margin-left: 1.5em;
      }
      .nav-system-error { color: #ff8174 !important; font-weight: 700; }

      /* PCS canonical Edit button — filled dark green, matches swf-monitor. */
      .btn.btn-dark-green {
        background-color: #166534; border-color: #166534; color: #fff;
      }
      .btn.btn-dark-green:hover, .btn.btn-dark-green:focus {
        background-color: #14532d; border-color: #14532d; color: #fff;
      }
      .btn.btn-dark-green:disabled, .btn.btn-dark-green.disabled {
        background-color: #6c757d; border-color: #6c757d; color: #e9ecef;
      }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="sticky-header">
    {% monitor_nav %}
    </div>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
