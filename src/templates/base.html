{% load static monitor_nav %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ePIC Production Monitor{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/state-colors.css' %}">
    <style>
      nav { display: flex; align-items: center; gap: .8em; padding: .5em 1em; background: #222; position: sticky; top: 0; z-index: 1030; }
      .nav-spacer { flex: 1 1 auto; }
      .nav-analysis { margin-left: 1.5em; }
      .nav-auth { display: flex; gap: 1em; align-items: center; }
      nav a, .dropbtn { color: #ADD8E6; text-decoration: none; }
      nav a:hover { text-decoration: underline; }
      nav a.nav-active, .dropbtn.nav-active {
        text-shadow: 0 0 .65px currentColor, 0 0 .65px currentColor;
      }

      .dropbtn { background: inherit; padding: 0; font-size: inherit; border: none; cursor: pointer; }
      .dropdown { position: relative; display: inline-block; margin-right: .35em; }
      .dropdown-content {
        display: none; position: absolute; background: #f9f9f9;
        min-width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,.2); z-index: 1;
      }
      .dropdown-content a { color: #000; padding: 10px 14px; display: block; }
      .dropdown-content a.nav-active { background-color: #e9ecef; }
      .dropdown-content a:hover { background: #f1f1f1; }
      .dropdown:hover .dropdown-content { display: block; }
      #mode-label {
        border-right: 1px solid rgba(255,255,255,.2);
        color: #fff;
        font-weight: 700;
        margin-right: 4px;
        padding-right: 12px;
      }
      .nav-label {
        color: #fff;
        font-weight: 700;
      }
      .nav-panda-label {
        margin-left: 1.5em;
      }
      /* The nav is the monitor's own (monitor_client.nav_html); these rules
         select its production mode, as the monitor's stylesheet does. */
      .nav-mode { display: none; }
      .nav-production { display: contents; }
      #mode-label .mode-title { display: none; }
      #mode-label .mode-title-production { display: inline; }
      .nav-system-error { color: #ff8174 !important; font-weight: 700; }

      /* PCS canonical Edit button — filled dark green, matches swf-monitor. */
      .btn.btn-dark-green {
        background-color: #166534; border-color: #166534; color: #fff;
      }
      .btn.btn-dark-green:hover, .btn.btn-dark-green:focus {
        background-color: #14532d; border-color: #14532d; color: #fff;
      }
      .btn.btn-dark-green:disabled, .btn.btn-dark-green.disabled {
        background-color: #6c757d; border-color: #6c757d; color: #e9ecef;
      }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% monitor_nav %}
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
